<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fondo profundo fibra de carbono / obsidiana -->
    <radialGradient id="bgGlow" cx="160" cy="110" r="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="0.48" stop-color="#090e1a"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>

    <!-- Halo atmosférico cian superior derecho -->
    <radialGradient id="ambientCyan" cx="390" cy="120" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Halo cálido ámbar/rojo inferior izquierdo -->
    <radialGradient id="ambientAmber" cx="120" cy="400" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#f43f5e" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Marco biselado metálico -->
    <linearGradient id="frameBorder" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#475569" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0.65"/>
    </linearGradient>

    <!-- Corona de titanio del engranaje (coordenadas centradas en 0,0) -->
    <linearGradient id="gearMetal" x1="-190" y1="-190" x2="190" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="0.28" stop-color="#94a3b8"/>
      <stop offset="0.55" stop-color="#334155"/>
      <stop offset="0.82" stop-color="#64748b"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Pista del disco de freno cerámico ventilado -->
    <linearGradient id="rotorTrack" x1="-165" y1="-165" x2="165" y2="165" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#64748b"/>
      <stop offset="0.3" stop-color="#334155"/>
      <stop offset="0.65" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>

    <!-- Brillo especular sobre el disco -->
    <linearGradient id="rotorSheen" x1="-165" y1="165" x2="165" y2="-165" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Arco de tacómetro luminoso -->
    <linearGradient id="tachArc" x1="-90" y1="60" x2="90" y2="-60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="0.45" stop-color="#38bdf8"/>
      <stop offset="0.78" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Pinza monobloque de competición en oro anodizado / ámbar -->
    <linearGradient id="caliperBody" x1="-90" y1="-205" x2="90" y2="-115" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="0.3" stop-color="#f59e0b"/>
      <stop offset="0.75" stop-color="#ea580c"/>
      <stop offset="1" stop-color="#9a3412"/>
    </linearGradient>

    <!-- Aguja incandescente -->
    <linearGradient id="needleGrad" x1="0" y1="28" x2="0" y2="-108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="0.55" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Tuerca central Center-Lock azul anodizado -->
    <radialGradient id="centerLock" cx="-8" cy="-8" r="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.45" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#0c4a6e"/>
    </radialGradient>
  </defs>

  <!-- Fondo con iluminación ambiental -->
  <rect width="512" height="512" rx="114" fill="url(#bgGlow)"/>
  <rect width="512" height="512" rx="114" fill="url(#ambientCyan)"/>
  <rect width="512" height="512" rx="114" fill="url(#ambientAmber)"/>

  <!-- Cuadrícula técnica sutil de fondo -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.06">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>

  <!-- Bisel exterior de cristal -->
  <rect x="10" y="10" width="492" height="492" rx="105" fill="none" stroke="url(#frameBorder)" stroke-width="3.5"/>

  <!-- Conjunto mecánico central -->
  <g transform="translate(256 262)">
    <!-- Sombra proyectada general -->
    <circle cx="0" cy="14" r="196" fill="#000000" opacity="0.55"/>

    <!-- Corona dentada de transmisión (16 dientes de acero mecanizado) -->
    <g fill="url(#gearMetal)" stroke="#0f172a" stroke-width="3">
      <rect x="-20" y="-200" width="40" height="400" rx="9"/>
      <rect x="-20" y="-200" width="40" height="400" rx="9" transform="rotate(22.5)"/>
      <rect x="-20" y="-200" width="40" height="400" rx="9" transform="rotate(45)"/>
      <rect x="-20" y="-200" width="40" height="400" rx="9" transform="rotate(67.5)"/>
      <rect x="-20" y="-200" width="40" height="400" rx="9" transform="rotate(90)"/>
      <rect x="-20" y="-200" width="40" height="400" rx="9" transform="rotate(112.5)"/>
      <rect x="-20" y="-200" width="40" height="400" rx="9" transform="rotate(135)"/>
      <rect x="-20" y="-200" width="40" height="400" rx="9" transform="rotate(157.5)"/>
    </g>

    <!-- Disco de freno cerámico con reflejo metálico -->
    <circle r="176" fill="url(#rotorTrack)" stroke="#94a3b8" stroke-width="5"/>
    <circle r="176" fill="url(#rotorSheen)"/>
    <circle r="162" fill="none" stroke="#cbd5e1" stroke-width="1.5" opacity="0.3"/>
    <circle r="138" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="14 10" opacity="0.38"/>
    <circle r="118" fill="none" stroke="#cbd5e1" stroke-width="1.5" opacity="0.28"/>

    <!-- Perforaciones de refrigeración del rotor cerámico -->
    <g fill="#090d16" stroke="#94a3b8" stroke-width="1.8">
      <g id="vents">
        <circle cx="-6" cy="-152" r="5.5"/>
        <circle cx="8" cy="-138" r="5.5"/>
        <circle cx="22" cy="-124" r="5"/>
      </g>
      <use href="#vents" transform="rotate(45)"/>
      <use href="#vents" transform="rotate(90)"/>
      <use href="#vents" transform="rotate(135)"/>
      <use href="#vents" transform="rotate(180)"/>
      <use href="#vents" transform="rotate(225)"/>
      <use href="#vents" transform="rotate(270)"/>
      <use href="#vents" transform="rotate(315)"/>
    </g>

    <!-- Campana central profunda con esfera de tacómetro -->
    <circle r="108" fill="#060a12" stroke="#1e293b" stroke-width="6"/>
    <circle r="101" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.25"/>

    <!-- Halo exterior del arco del tacómetro -->
    <path d="M -73 53 A 90 90 0 1 1 73 53" fill="none" stroke="url(#tachArc)" stroke-width="22" stroke-linecap="round" opacity="0.24"/>
    <!-- Arco principal nítido del tacómetro -->
    <path d="M -73 53 A 90 90 0 1 1 73 53" fill="none" stroke="url(#tachArc)" stroke-width="11" stroke-linecap="round"/>

    <!-- Marcas de escala del tacómetro -->
    <g stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round">
      <line x1="0" y1="-82" x2="0" y2="-68" transform="rotate(-120)"/>
      <line x1="0" y1="-82" x2="0" y2="-68" transform="rotate(-80)"/>
      <line x1="0" y1="-82" x2="0" y2="-68" transform="rotate(-40)"/>
      <line x1="0" y1="-82" x2="0" y2="-68"/>
      <line x1="0" y1="-82" x2="0" y2="-68" transform="rotate(40)"/>
      <line x1="0" y1="-82" x2="0" y2="-68" stroke="#fbbf24" transform="rotate(80)"/>
      <line x1="0" y1="-82" x2="0" y2="-68" stroke="#f43f5e" transform="rotate(120)"/>
    </g>

    <!-- Pinza de freno monobloque Brembo-style (arriba a la izquierda) -->
    <g transform="rotate(-40)">
      <!-- Sombra de la pinza sobre el disco -->
      <path d="M -94 -184 Q 0 -212 94 -184 L 78 -104 Q 0 -122 -78 -104 Z" fill="#000000" opacity="0.55" transform="translate(0 8)"/>
      <!-- Cuerpo de la pinza en oro anodizado -->
      <path d="M -92 -188 Q 0 -216 92 -188 L 76 -108 Q 0 -126 -76 -108 Z" fill="url(#caliperBody)" stroke="#fef08a" stroke-width="3"/>
      <!-- Nervaduras mecanizadas CNC y pistones -->
      <path d="M -74 -174 Q 0 -196 74 -174" fill="none" stroke="#fef9c3" stroke-width="2.5" opacity="0.65"/>
      <rect x="-52" y="-168" width="32" height="16" rx="6" fill="#090d16" stroke="#fde047" stroke-width="1.5"/>
      <rect x="20" y="-168" width="32" height="16" rx="6" fill="#090d16" stroke="#fde047" stroke-width="1.5"/>
      <circle cx="-54" cy="-134" r="8" fill="#1e293b" stroke="#fef08a" stroke-width="2.5"/>
      <circle cx="0" cy="-141" r="9.5" fill="#1e293b" stroke="#fef08a" stroke-width="2.5"/>
      <circle cx="54" cy="-134" r="8" fill="#1e293b" stroke="#fef08a" stroke-width="2.5"/>
    </g>

    <!-- Aguja del tacómetro con halo luminoso apuntando a 7.000 rpm -->
    <g transform="rotate(52)">
      <path d="M -11 28 L -4 -94 L 0 -108 L 4 -94 L 11 28 Z" fill="#f97316" opacity="0.35"/>
      <path d="M -6.5 24 L -2.5 -92 L 0 -105 L 2.5 -92 L 6.5 24 Z" fill="url(#needleGrad)"/>
    </g>

    <!-- Tuerca central hexagonal Center-Lock -->
    <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="#1e293b" stroke="#cbd5e1" stroke-width="3.5"/>
    <circle r="24" fill="url(#centerLock)" stroke="#e0f2fe" stroke-width="2.5"/>
    <circle cx="-7" cy="-7" r="6" fill="#ffffff" opacity="0.75"/>
  </g>
</svg>
